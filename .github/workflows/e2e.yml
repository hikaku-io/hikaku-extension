name: End-to-end

# Heavier: downloads the model (~200 MB) and Chrome for Testing, and fetches
# labelled images from Wikimedia Commons. Run on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup -- --model=uint8
      - name: Model sanity evaluation
        run: npm run eval-model -- --n=16
      - run: npm run build -- --offline --target=chrome
      - name: Extension end-to-end test (built package)
        run: |
          EXT_DIR="$PWD/$(ls -d dist/hikaku-*-offline | head -1)" xvfb-run --auto-servernum npm run e2e -- e2e-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
